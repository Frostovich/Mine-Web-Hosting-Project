<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат-приложение</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0a0c10;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Контейнер приложения */
        .app-container {
            width: 1200px;
            max-width: 100%;
            background: #14161c;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Шапка */
        .header {
            background: #0c0e12;
            padding: 16px 24px;
            border-bottom: 1px solid #2a2f3a;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 500;
            color: #3a86ff;
        }

        /* Основное содержимое */
        .main-content {
            display: flex;
            flex-direction: row;
            min-height: 600px;
        }

        /* Боковая панель (поиск и контакты) */
        .sidebar {
            width: 300px;
            background: #101216;
            border-right: 1px solid #2a2f3a;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Область чата */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #14161c;
        }

        .chat-header {
            padding: 16px 24px;
            background: #101216;
            border-bottom: 1px solid #2a2f3a;
            font-weight: 500;
        }

        .messages-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .message-mine {
            background: #3a86ff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message-other {
            background: #2a2f3a;
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message-sender {
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 4px;
            color: #aaa;
        }

        .message-time {
            font-size: 0.65rem;
            text-align: right;
            margin-top: 4px;
            color: #888;
        }

        .input-area {
            padding: 16px 24px;
            background: #101216;
            border-top: 1px solid #2a2f3a;
            display: flex;
            gap: 12px;
        }

        .input-area input {
            flex: 1;
            background: #0c0e12;
            border: 1px solid #2a2f3a;
            border-radius: 30px;
            padding: 10px 16px;
            color: white;
            outline: none;
        }

        .input-area input:focus {
            border-color: #3a86ff;
        }

        button {
            background: #3a86ff;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }

        button:hover {
            background: #2666cc;
        }

        .btn-secondary {
            background: #2a2f3a;
        }

        .btn-secondary:hover {
            background: #3a3f4a;
        }

        /* Формы входа/регистрации (показываются до авторизации) */
        .auth-container {
            max-width: 400px;
            margin: 40px auto;
            background: #14161c;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .auth-tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid #2a2f3a;
        }

        .auth-tab {
            padding: 10px 0;
            cursor: pointer;
            font-weight: 500;
            color: #aaa;
        }

        .auth-tab.active {
            color: #3a86ff;
            border-bottom: 2px solid #3a86ff;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .auth-form input {
            background: #0c0e12;
            border: 1px solid #2a2f3a;
            border-radius: 30px;
            padding: 12px 16px;
            color: white;
            outline: none;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 10px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        .user-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .user-item {
            background: #0c0e12;
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .user-item:hover {
            background: #1e2229;
        }

        .search-box {
            margin-bottom: 10px;
        }

        .search-box input {
            width: 100%;
            background: #0c0e12;
            border: 1px solid #2a2f3a;
            border-radius: 30px;
            padding: 8px 12px;
            color: white;
        }
    </style>
</head>
<body>
<div id="app">
    <!-- Форма входа/регистрации -->
    <div id="authContainer" class="auth-container">
        <div class="auth-tabs">
            <div class="auth-tab active" data-tab="login">Вход</div>
            <div class="auth-tab" data-tab="register">Регистрация</div>
        </div>
        <div id="loginForm" class="auth-form">
            <input type="text" id="loginUsername" placeholder="Имя пользователя" />
            <input type="password" id="loginPassword" placeholder="Пароль" />
            <button id="loginBtn">Войти</button>
            <div id="loginError" class="error-message"></div>
        </div>
        <div id="registerForm" class="auth-form hidden">
            <input type="text" id="regUsername" placeholder="Имя пользователя" />
            <input type="password" id="regPassword" placeholder="Пароль" />
            <input type="email" id="regEmail" placeholder="Email" />
            <button id="registerBtn">Зарегистрироваться</button>
            <div id="regError" class="error-message"></div>
        </div>
    </div>

    <!-- Основное приложение (чат) -->
    <div id="chatApp" class="app-container hidden">
        <div class="header">
            <h1>Чат на ASP.NET + SignalR</h1>
        </div>
        <div class="main-content">
            <div class="sidebar">
                <div class="search-box">
                    <input type="text" id="searchUserInput" placeholder="Поиск пользователей..." />
                    <button id="searchUserBtn" style="margin-top: 8px; width: 100%;">Найти</button>
                </div>
                <div id="searchResults" class="user-list">
                    <!-- Результаты поиска будут здесь -->
                </div>
                <hr style="border-color: #2a2f3a; margin: 10px 0;" />
                <div>
                    <button id="logoutBtn" class="btn-secondary" style="width: 100%;">Выйти</button>
                </div>
            </div>
            <div class="chat-area">
                <div class="chat-header" id="chatHeader">Выберите пользователя для чата</div>
                <div id="messagesList" class="messages-list"></div>
                <div class="input-area" id="chatInputArea" style="display: none;">
                    <input type="text" id="messageInput" placeholder="Введите сообщение..." />
                    <button id="sendMessageBtn">Отправить</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
<script>
    // Конфигурация API
    const API_BASE = ''; // если бэк на другом порту, укажите базовый URL, например 'http://localhost:5000'
    const HUB_URL = '/chathub'; // полный URL, если отличается, укажите

    let token = localStorage.getItem('token') || null;
    let connection = null;
    let currentChatUserId = null;
    let currentChatUserName = null;
    let currentUserId = null; // будет получено из JWT при логине

    // DOM элементы
    const authContainer = document.getElementById('authContainer');
    const chatApp = document.getElementById('chatApp');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const loginBtn = document.getElementById('loginBtn');
    const registerBtn = document.getElementById('registerBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const searchUserInput = document.getElementById('searchUserInput');
    const searchUserBtn = document.getElementById('searchUserBtn');
    const searchResultsDiv = document.getElementById('searchResults');
    const messagesList = document.getElementById('messagesList');
    const chatHeader = document.getElementById('chatHeader');
    const chatInputArea = document.getElementById('chatInputArea');
    const messageInput = document.getElementById('messageInput');
    const sendMessageBtn = document.getElementById('sendMessageBtn');
    const loginError = document.getElementById('loginError');
    const regError = document.getElementById('regError');

    // Вспомогательные функции
    function showError(element, message) {
        element.textContent = message;
        setTimeout(() => { element.textContent = ''; }, 3000);
    }

    async function apiRequest(url, method, data = null, requireAuth = true) {
        const headers = {
            'Content-Type': 'application/json',
        };
        if (requireAuth && token) {
            headers['Authorization'] = `Bearer ${token}`;
        }
        const response = await fetch(`${API_BASE}${url}`, {
            method,
            headers,
            body: data ? JSON.stringify(data) : null,
        });
        if (response.status === 401 && requireAuth) {
            // токен недействителен
            logout();
            throw new Error('Не авторизован');
        }
        return response;
    }

    async function handleLogin(username, password) {
        try {
            const res = await apiRequest('/api/auth/login', 'POST', { username, password }, false);
            if (!res.ok) {
                const err = await res.text();
                throw new Error(err || 'Ошибка входа');
            }
            const data = await res.json();
            token = data.token;
            localStorage.setItem('token', token);
            await initChatApp();
        } catch (err) {
            showError(loginError, err.message);
        }
    }

    async function handleRegister(username, password, email) {
        try {
            const res = await apiRequest('/api/auth/register', 'POST', { username, password, email }, false);
            if (!res.ok) {
                const err = await res.text();
                throw new Error(err || 'Ошибка регистрации');
            }
            const data = await res.json();
            token = data.token;
            localStorage.setItem('token', token);
            await initChatApp();
        } catch (err) {
            showError(regError, err.message);
        }
    }

    function logout() {
        token = null;
        localStorage.removeItem('token');
        if (connection) {
            connection.stop();
            connection = null;
        }
        currentChatUserId = null;
        currentUserId = null;
        chatApp.classList.add('hidden');
        authContainer.classList.remove('hidden');
        // очистим поля
        loginUsername.value = '';
        loginPassword.value = '';
        regUsername.value = '';
        regPassword.value = '';
        regEmail.value = '';
        messagesList.innerHTML = '';
        searchResultsDiv.innerHTML = '';
        chatHeader.innerText = 'Выберите пользователя для чата';
        chatInputArea.style.display = 'none';
    }

    async function searchUsers(query) {
        if (!query.trim()) {
            searchResultsDiv.innerHTML = '';
            return;
        }
        try {
            const res = await apiRequest(`/api/users/search?query=${encodeURIComponent(query)}`, 'GET');
            if (!res.ok) throw new Error('Ошибка поиска');
            const users = await res.json();
            renderSearchResults(users);
        } catch (err) {
            console.error(err);
            searchResultsDiv.innerHTML = '<div class="error-message">Ошибка поиска</div>';
        }
    }

    function renderSearchResults(users) {
        if (!users.length) {
            searchResultsDiv.innerHTML = '<div class="user-item">Пользователи не найдены</div>';
            return;
        }
        searchResultsDiv.innerHTML = users.map(u => `
            <div class="user-item" data-user-id="${u.id}" data-user-name="${u.userName}">
                ${u.userName}
            </div>
        `).join('');
        // назначить обработчики
        document.querySelectorAll('.user-item[data-user-id]').forEach(el => {
            el.addEventListener('click', () => {
                const userId = el.getAttribute('data-user-id');
                const userName = el.getAttribute('data-user-name');
                openChat(userId, userName);
            });
        });
    }

    async function openChat(userId, userName) {
        if (currentChatUserId === userId) return;
        currentChatUserId = userId;
        currentChatUserName = userName;
        chatHeader.innerText = `Чат с ${userName}`;
        chatInputArea.style.display = 'flex';
        // загрузить историю сообщений
        await loadHistory(userId);
    }

    async function loadHistory(userId) {
        try {
            const res = await apiRequest(`/api/messages/history/${userId}`, 'GET');
            if (!res.ok) throw new Error('Ошибка загрузки истории');
            const messages = await res.json();
            displayMessages(messages);
        } catch (err) {
            console.error(err);
            messagesList.innerHTML = '<div class="error-message">Не удалось загрузить историю</div>';
        }
    }

    function displayMessages(messages) {
        messagesList.innerHTML = '';
        if (!messages.length) {
            messagesList.innerHTML = '<div class="message-other">Нет сообщений, начните диалог!</div>';
            return;
        }
        messages.forEach(msg => {
            const isMine = msg.senderId == currentUserId; // предполагаем, что сервер возвращает senderId
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isMine ? 'message-mine' : 'message-other'}`;
            if (!isMine) {
                const senderSpan = document.createElement('div');
                senderSpan.className = 'message-sender';
                senderSpan.innerText = msg.senderName || msg.senderId;
                msgDiv.appendChild(senderSpan);
            }
            const contentSpan = document.createElement('div');
            contentSpan.innerText = msg.content;
            msgDiv.appendChild(contentSpan);
            const timeSpan = document.createElement('div');
            timeSpan.className = 'message-time';
            timeSpan.innerText = new Date(msg.sentAt).toLocaleTimeString();
            msgDiv.appendChild(timeSpan);
            messagesList.appendChild(msgDiv);
        });
        messagesList.scrollTop = messagesList.scrollHeight;
    }

    async function sendMessage() {
        if (!currentChatUserId) {
            alert('Сначала выберите получателя');
            return;
        }
        const text = messageInput.value.trim();
        if (!text) return;
        messageInput.value = '';
        try {
            await connection.invoke('SendMessage', currentChatUserId, text);
        } catch (err) {
            console.error('Ошибка отправки:', err);
            alert('Не удалось отправить сообщение');
        }
    }

    // SignalR
    async function initSignalR() {
        if (connection) {
            await connection.stop();
        }
        connection = new signalR.HubConnectionBuilder()
            .withUrl(`${API_BASE}${HUB_URL}`, {
                accessTokenFactory: () => token
            })
            .withAutomaticReconnect()
            .build();

        connection.on('ReceiveMessage', (message) => {
            // message — объект с полями id, content, sentAt, senderId, isMine (или senderName)
            // предположим, что senderId есть
            if (!currentChatUserId || message.senderId == currentChatUserId) {
                // если это сообщение от текущего собеседника или наша отправка (но isMine может не быть)
                loadHistory(currentChatUserId);
            } else {
                // можно показать уведомление
                console.log(`Новое сообщение от ${message.senderId}: ${message.content}`);
                // можно добавить простой визуальный сигнал
                if (Notification.permission === 'granted') {
                    new Notification(`Сообщение от ${message.senderName || message.senderId}`, { body: message.content });
                }
            }
        });

        try {
            await connection.start();
            console.log('SignalR подключен');
            // после подключения можно запросить текущего пользователя JWT
            // предположим, что в JWT есть NameIdentifier, можно его получить через отдельный endpoint
            await fetchCurrentUserId();
        } catch (err) {
            console.error('SignalR ошибка:', err);
        }
    }

    async function fetchCurrentUserId() {
        // Для получения currentUserId можно использовать отдельный endpoint, например GET /api/users/me
        // Если нет, можно попытаться декодировать JWT (но это небезопасно).
        // Лучше добавить endpoint, который возвращает информацию о текущем пользователе.
        // Для упрощения допустим, что сервер возвращает userId в методе search или history?
        // Сделаем заглушку: при первом открытии чата или через отдельный вызов.
        // Реализуем вызов /api/users/me, если его нет, то декодируем JWT на клиенте (для демо).
        try {
            const res = await apiRequest('/api/users/me', 'GET');
            if (res.ok) {
                const data = await res.json();
                currentUserId = data.id;
            } else {
                // fallback: декодировать JWT
                const payload = token.split('.')[1];
                const decoded = JSON.parse(atob(payload));
                currentUserId = decoded[
                    'http://schemas.xmlsoap.org/ws/2005/05/identity/claims/nameidentifier'
                    ] || decoded['nameid'] || decoded['sub'];
            }
        } catch (e) {
            console.warn('Не удалось получить currentUserId', e);
        }
    }

    async function initChatApp() {
        // скрыть форму авторизации, показать чат
        authContainer.classList.add('hidden');
        chatApp.classList.remove('hidden');
        // инициализировать SignalR
        await initSignalR();
        // загрузить начальный список? можно пустой поиск
        searchResultsDiv.innerHTML = '';
        currentChatUserId = null;
        chatHeader.innerText = 'Выберите пользователя для чата';
        chatInputArea.style.display = 'none';
        messagesList.innerHTML = '';
        // запросить разрешение на уведомления (опционально)
        if (Notification.permission !== 'granted' && Notification.permission !== 'denied') {
            Notification.requestPermission();
        }
    }

    // Обработчики событий
    loginBtn.addEventListener('click', () => {
        const username = document.getElementById('loginUsername').value;
        const password = document.getElementById('loginPassword').value;
        if (!username || !password) {
            showError(loginError, 'Заполните поля');
            return;
        }
        handleLogin(username, password);
    });

    registerBtn.addEventListener('click', () => {
        const username = document.getElementById('regUsername').value;
        const password = document.getElementById('regPassword').value;
        const email = document.getElementById('regEmail').value;
        if (!username || !password || !email) {
            showError(regError, 'Заполните все поля');
            return;
        }
        handleRegister(username, password, email);
    });

    logoutBtn.addEventListener('click', logout);

    searchUserBtn.addEventListener('click', () => {
        const query = searchUserInput.value.trim();
        if (query) searchUsers(query);
    });
    searchUserInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') searchUsers(searchUserInput.value.trim());
    });

    sendMessageBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // Переключение табов входа/регистрации
    const tabs = document.querySelectorAll('.auth-tab');
    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            const target = tab.getAttribute('data-tab');
            if (target === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
            }
        });
    });

    // Если уже есть токен при загрузке страницы, сразу показать чат
    if (token) {
        initChatApp().catch(err => {
            console.error('Ошибка инициализации:', err);
            logout();
        });
    }
</script>
</body>
</html>
